[project]
name = "person-of-intrest"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "svlearn-bootcamp>=0.1.7",
    "streamlit>=1.28",
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.49",
    "pillow>=10.0",
    "numpy>=1.24",
    "scikit-learn>=1.6",
    "faiss-cpu>=1.7.4",
    "deepface>=0.0.79",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

# If you also build sdists and want data included:
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    # ... other includes like README, pyproject.toml, etc.
]

[tool.hatch.build.targets.wheel]
packages = ["src/person_of_intrest"]
